<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopInsight · 电商实时经营看板</title>
<style>
  /* ── 调色板：亮/暗两套都是「选定」的，不是自动翻转 ───────────────── */
  .viz-root {
    color-scheme: light;
    --surface:      #fcfcfb;   /* 卡片表面 */
    --plane:        #f9f9f7;   /* 页面底色 */
    --ink:          #0b0b0b;   /* 主文字 */
    --ink-2:        #52514e;   /* 次文字 */
    --muted:        #898781;   /* 轴/弱化标签 */
    --grid:         #e1e0d9;   /* 网格发丝线 */
    --baseline:     #c3c2b7;   /* 基线 */
    --series-1:     #2a78d6;   /* 分类槽位 1（蓝）—— 本页所有图表都是单序列 */
    --border:       rgba(11,11,11,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface:  #1a1a19;
      --plane:    #0d0d0d;
      --ink:      #ffffff;
      --ink-2:    #c3c2b7;
      --muted:    #898781;
      --grid:     #2c2c2a;
      --baseline: #383835;
      --series-1: #3987e5;
      --border:   rgba(255,255,255,0.10);
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface:  #1a1a19;
    --plane:    #0d0d0d;
    --ink:      #ffffff;
    --ink-2:    #c3c2b7;
    --muted:    #898781;
    --grid:     #2c2c2a;
    --baseline: #383835;
    --series-1: #3987e5;
    --border:   rgba(255,255,255,0.10);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    background: var(--plane);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .viz-root { max-width: 1180px; margin: 0 auto; padding: 28px 20px 48px; }

  /* ── 页头 ──────────────────────────────────────────────────────── */
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #0ca30c; }
  .dot.err { background: #d03b3b; }

  /* ── KPI 行 ────────────────────────────────────────────────────── */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px;
  }
  .tile .label { font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
  /* 大数字用比例数字，不用 tabular-nums —— 后者在展示字号下会显得松散 */
  .tile .value { font-size: 32px; font-weight: 650; line-height: 1.1; letter-spacing: -0.02em; }
  .tile .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* ── 卡片 ──────────────────────────────────────────────────────── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px 20px 20px; margin-bottom: 20px;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .card .desc { font-size: 12.5px; color: var(--ink-2); margin-bottom: 14px; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }

  /* ── 折线图 ────────────────────────────────────────────────────── */
  .chart-wrap { position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axis-text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .crosshair { stroke: var(--baseline); stroke-width: 1; }

  /* 提示框 */
  .tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .08s;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.13);
    white-space: nowrap; z-index: 10;
  }
  .tip .t { color: var(--ink-2); margin-bottom: 4px; font-size: 11.5px; }
  .tip .row { display: flex; align-items: center; gap: 6px; }
  .tip .sw { width: 9px; height: 9px; border-radius: 2px; background: var(--series-1); }
  .tip .v { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ── 表格 ──────────────────────────────────────────────────────── */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: right; font-weight: 500; color: var(--muted); font-size: 12px;
    padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap;
  }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--grid); text-align: right;
       font-variant-numeric: tabular-nums; color: var(--ink-2); }
  td:first-child { color: var(--ink); font-variant-numeric: normal; }
  tr:last-child td { border-bottom: none; }
  .rank { display: inline-block; width: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<div class="viz-root">

  <header>
    <div>
      <h1>ShopInsight · 电商实时经营看板</h1>
      <div class="sub">数据源：1.1 亿行用户行为 · 实时窗口由 Kafka → Flink → ClickHouse 计算</div>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">加载中…</span></div>
  </header>

  <!-- KPI 行 -->
  <section class="kpis">
    <div class="tile"><div class="label">窗口内 PV（浏览量）</div><div class="value" id="kpiPv">—</div><div class="meta" id="kpiPvMeta">最新窗口</div></div>
    <div class="tile"><div class="label">窗口内 UV（独立访客）</div><div class="value" id="kpiUv">—</div><div class="meta" id="kpiUvMeta">最新窗口</div></div>
    <div class="tile"><div class="label">窗口内成交额</div><div class="value" id="kpiGmv">—</div><div class="meta" id="kpiGmvMeta">最新窗口</div></div>
  </section>

  <!-- PV 趋势 -->
  <section class="card">
    <h2>PV 趋势</h2>
    <div class="desc">按 1 分钟事件时间窗口聚合，最近 <span id="trendN">60</span> 个窗口</div>
    <div class="chart-wrap">
      <svg id="trend" viewBox="0 0 1000 240" preserveAspectRatio="none" role="img" aria-label="PV 趋势折线图"></svg>
      <div class="tip" id="trendTip"></div>
    </div>
  </section>

  <div class="grid-2">
    <!-- 品牌排行 -->
    <section class="card">
      <h2>品牌成交额排行</h2>
      <div class="desc">品牌是数据里最接近「商家」的实体</div>
      <table>
        <thead><tr><th>品牌</th><th>PV</th><th>购买数</th><th>成交额</th><th>客单价</th></tr></thead>
        <tbody id="brandBody"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
      </table>
    </section>

    <!-- 类目排行 -->
    <section class="card">
      <h2>类目成交额排行</h2>
      <div class="desc">按类目 ID 聚合，定位高价值品类</div>
      <table>
        <thead><tr><th>类目 ID</th><th>PV</th><th>购买数</th><th>成交额</th><th>客单价</th></tr></thead>
        <tbody id="catBody"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
      </table>
    </section>
  </div>

</div>

<script>
const API = '';
const REFRESH_MS = 1000;

/* ── 数字格式化：自动紧凑（1,284 / 12.9K / 4.2M）────────────────── */
function compact(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (a >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (a >= 1e4) return (n / 1e3).toFixed(1) + 'K';
  return n.toLocaleString('en-US');
}
function money(n) { return '$' + compact(n); }
function full(n) { return n === null ? '—' : Number(n).toLocaleString('en-US'); }

/* ── 取数据 ─────────────────────────────────────────────────────── */
async function get(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(path + ' → HTTP ' + r.status);
  return r.json();
}

function setStatus(ok, text) {
  document.getElementById('dot').className = 'dot' + (ok ? '' : ' err');
  document.getElementById('statusText').textContent = text;
}

/* ── 折线图：单序列，不需要图例（标题已说明画的是什么）─────────── */
const W = 1000, H = 240, PAD = { t: 16, r: 44, b: 26, l: 48 };
let chartPoints = [];

function drawTrend(rows) {
  const svg = document.getElementById('trend');
  // API 返回按时间倒序，画图要按时间正序
  const data = rows.slice().reverse();
  chartPoints = [];
  if (!data.length) { svg.innerHTML = ''; return; }

  const maxV = Math.max(...data.map(d => d.pv));
  const niceMax = Math.ceil(maxV / 200) * 200 || 200;   // y 轴取整到 200 的倍数
  const iw = W - PAD.l - PAD.r;
  const ih = H - PAD.t - PAD.b;

  const x = i => PAD.l + (data.length === 1 ? iw / 2 : (i / (data.length - 1)) * iw);
  const y = v => PAD.t + ih - (v / niceMax) * ih;

  let g = '';
  // 网格：4 条水平发丝线
  for (let k = 0; k <= 4; k++) {
    const v = (niceMax / 4) * k, yy = y(v);
    g += `<line class="gridline" x1="${PAD.l}" y1="${yy}" x2="${W - PAD.r}" y2="${yy}"/>`;
    g += `<text class="axis-text" x="${PAD.l - 8}" y="${yy + 3.5}" text-anchor="end">${compact(v)}</text>`;
  }
  // x 轴：首/中/尾三个刻度，避免拥挤
  [0, Math.floor(data.length / 2), data.length - 1].forEach(i => {
    if (!data[i]) return;
    const t = (data[i].window_start || '').slice(11, 16);   // HH:MM
    g += `<text class="axis-text" x="${x(i)}" y="${H - 6}" text-anchor="middle">${t}</text>`;
  });

  const pts = data.map((d, i) => [x(i), y(d.pv)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L ${pts[pts.length - 1][0].toFixed(1)} ${PAD.t + ih} L ${pts[0][0].toFixed(1)} ${PAD.t + ih} Z`;

  // 面积用 10% 透明度的淡色，不是实心块
  g += `<path d="${area}" fill="var(--series-1)" fill-opacity="0.10"/>`;
  g += `<path d="${line}" fill="none" stroke="var(--series-1)" stroke-width="2"
          stroke-linejoin="round" stroke-linecap="round"/>`;

  // 末端标记：8px 圆点 + 2px 表面色环，保证压在线上也看得清
  const [lx, ly] = pts[pts.length - 1];
  g += `<circle cx="${lx}" cy="${ly}" r="4" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2"/>`;
  // 末端直接标注数值（只标一个，不是每个点都标）
  g += `<text class="axis-text" x="${lx + 10}" y="${ly + 4}" fill="var(--ink-2)">${compact(data[data.length - 1].pv)}</text>`;

  g += `<line id="cross" class="crosshair" x1="0" y1="${PAD.t}" x2="0" y2="${PAD.t + ih}" opacity="0"/>`;

  svg.innerHTML = g;
  chartPoints = pts.map((p, i) => ({ x: p[0], y: p[1], d: data[i] }));

  // 悬停：十字准线 + 提示框
  svg.onmousemove = ev => {
    const rect = svg.getBoundingClientRect();
    const px = ((ev.clientX - rect.left) / rect.width) * W;
    let best = chartPoints[0], bd = Infinity;
    for (const p of chartPoints) { const dd = Math.abs(p.x - px); if (dd < bd) { bd = dd; best = p; } }
    const cross = document.getElementById('cross');
    cross.setAttribute('x1', best.x); cross.setAttribute('x2', best.x); cross.setAttribute('opacity', '1');
    const tip = document.getElementById('trendTip');
    tip.innerHTML = `<div class="t">${best.d.window_start}</div>
      <div class="row"><span class="sw"></span><span>PV</span><span class="v">${full(best.d.pv)}</span></div>
      <div class="row"><span class="sw" style="visibility:hidden"></span><span>UV</span><span class="v">${full(best.d.uv)}</span></div>`;
    tip.style.opacity = '1';
    const wrapW = svg.parentElement.getBoundingClientRect().width;
    let left = (best.x / W) * wrapW + 12;
    if (left > wrapW - 150) left -= 170;
    tip.style.left = left + 'px';
    tip.style.top = ((best.y / H) * svg.parentElement.getBoundingClientRect().height - 10) + 'px';
  };
  svg.onmouseleave = () => {
    document.getElementById('cross').setAttribute('opacity', '0');
    document.getElementById('trendTip').style.opacity = '0';
  };
}

/* ── 表格 ───────────────────────────────────────────────────────── */
function renderTable(tbodyId, rows, keyField) {
  const tb = document.getElementById(tbodyId);
  if (!rows || !rows.length) { tb.innerHTML = `<tr><td colspan="5" class="empty">暂无数据</td></tr>`; return; }
  tb.innerHTML = rows.map((r, i) => {
    const aov = r.purchase_cnt ? r.gmv / r.purchase_cnt : 0;
    return `<tr>
      <td><span class="rank">${i + 1}</span>${r[keyField]}</td>
      <td>${compact(r.pv)}</td>
      <td>${full(r.purchase_cnt)}</td>
      <td>${money(r.gmv)}</td>
      <td>${r.purchase_cnt ? '$' + aov.toFixed(2) : '—'}</td>
    </tr>`;
  }).join('');
}

/* ── 主循环 ─────────────────────────────────────────────────────── */
async function refresh() {
  try {
    const [ov, brands, cats] = await Promise.all([
      get('/api/overview?limit=60'),
      get('/api/brand-ranking?limit=10'),
      get('/api/category-ranking?limit=10'),
    ]);

    if (ov.length) {
      const latest = ov[0];
      document.getElementById('kpiPv').textContent = full(latest.pv);
      document.getElementById('kpiUv').textContent = full(latest.uv);
      document.getElementById('kpiGmv').textContent = money(latest.gmv);
      document.getElementById('kpiPvMeta').textContent = latest.window_start;
      document.getElementById('kpiUvMeta').textContent = latest.window_start;
      document.getElementById('kpiGmvMeta').textContent = latest.window_start;
    }
    document.getElementById('trendN').textContent = ov.length;
    drawTrend(ov);
    renderTable('brandBody', brands, 'brand');
    renderTable('catBody', cats, 'category_id');

    setStatus(true, '已更新 ' + new Date().toLocaleTimeString('zh-CN'));
  } catch (e) {
    setStatus(false, '取数失败：' + e.message);
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
